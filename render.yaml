services:
  - type: web
    name: seo-agent-web
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate:deploy && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seo-agent-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: seo-agent-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MONTHLY_COST_CAP_USD
        value: "5"
      - key: AI_DAILY_TOKEN_CAP
        value: "500000"
      - key: AI_PER_RUN_COST_CAP_USD
        value: "0.25"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: reports@seo-agent.app

  - type: worker
    name: seo-agent-crawl-worker
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema.production.prisma && npm prune --omit=dev
    startCommand: npm run worker
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seo-agent-redis
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          type: web
          name: seo-agent-web
          envVarKey: SESSION_SECRET
      - key: APP_URL
        fromService:
          type: web
          name: seo-agent-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRAWL_WORKER_CONCURRENCY
        value: "2"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MONTHLY_COST_CAP_USD
        value: "5"
      - key: AI_DAILY_TOKEN_CAP
        value: "500000"
      - key: AI_PER_RUN_COST_CAP_USD
        value: "0.25"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: reports@seo-agent.app

  - type: cron
    name: seo-agent-scheduler
    runtime: node
    plan: 0.5c-512mb
    schedule: "0 3 * * *"
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node scripts/run-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: APP_URL
        fromService:
          type: web
          name: seo-agent-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        fromService:
          type: web
          name: seo-agent-web
          envVarKey: CRON_SECRET

  - type: keyvalue
    name: seo-agent-redis
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: seo-agent-db
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    ipAllowList: []
